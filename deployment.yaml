
apiVersion: apps/v1
kind: Deployment
metadata:
  name: university-portal
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: university-portal
  template:
    metadata:
      labels:
        app: university-portal
    spec:
      containers:
        - name: university-portal
          image: priyadharshinib733/university-learning-portal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: university-portal-service
spec:
  type: NodePort
  selector:
    app: university-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30013
